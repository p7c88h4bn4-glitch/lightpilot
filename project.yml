name: LightPilot

# ------------------------------------------------------------------
# Set your Apple team ID here (Xcode > Settings > Accounts), then run:
#   xcodegen generate
# ------------------------------------------------------------------
settings:
  base:
    DEVELOPMENT_TEAM: "YOUR_TEAM_ID"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GCC_C_LANGUAGE_STANDARD: gnu11

options:
  bundleIdPrefix: com.mrbradsmusic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:

  LightPilot:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: LightPilotAU
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrbradsmusic.LightPilot
        PRODUCT_NAME: LightPilot
        SWIFT_OBJC_BRIDGING_HEADER: Shared/LightPilot-Bridging-Header.h
    entitlements:
      path: App/LightPilot.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mrbradsmusic.LightPilot
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LightPilot
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: LightPilot connects to your iStrip Pro lights over Bluetooth.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets:
        - LightPilotTests

  LightPilotAU:
    type: app-extension
    platform: iOS
    sources:
      - path: AUExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrbradsmusic.LightPilot.AU
        PRODUCT_NAME: LightPilotAU
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_OBJC_BRIDGING_HEADER: Shared/LightPilot-Bridging-Header.h
    entitlements:
      path: AUExtension/LightPilotAU.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mrbradsmusic.LightPilot
    info:
      path: AUExtension/Info.plist
      properties:
        CFBundleDisplayName: LightPilot
        NSBluetoothAlwaysUsageDescription: The LightPilot plugin connects to your iStrip Pro lights over Bluetooth.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit-UI
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).AudioUnitViewController
          NSExtensionAttributes:
            AudioComponents:
              - name: "Mr. Brad's Music: LightPilot"
                description: LightPilot
                manufacturer: MrBd
                type: aumi
                subtype: LtPl
                version: 1
                sandboxSafe: true
                tags:
                  - MIDI

  LightPilotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LightPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrbradsmusic.LightPilotTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/LightPilot.app/LightPilot
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
